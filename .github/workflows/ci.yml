name: Security Audit & Quality CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Security Audits & Regression Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies & pip-audit
        run: |
          python -m pip install --upgrade pip setuptools
          pip install --upgrade -r backend/requirements.txt pip-audit

      - name: Run pip-audit for Python dependency vulnerabilities
        run: pip-audit --strict

      - name: Run npm audit for frontend dependencies
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=critical

      - name: Run Pytest Comprehensive Test Suite
        env:
          ENVIRONMENT: development
        run: pytest tests/test_tools.py tests/test_api.py -v

      - name: Run Production-Configured Rate Limiting Verification
        run: PYTHONPATH=. python tests/verify_production_ratelimit.py

